
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KÖL — Form Ring</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="product-page">

        <div class="product-photo">
            <img src="images/ring.jpg"
                 alt="Silver sculptural ring">
        </div>

        <div class="product-information">

            <a href="catalog.html" class="back-link">
                ← BACK TO COLLECTION
            </a>

            <h1>FORM RING</h1>

            <p class="product-price">8 900 RSD</p>

            <p class="product-description">
                A sculptural silver ring inspired
                by organic shapes and minimal forms.
            </p>

            <p class="product-material">
                MATERIAL: STERLING SILVER
            </p>

            <div class="product-options">

                <label for="ring-size">SELECT SIZE</label>

                <select id="ring-size">
                    <option value="">Choose size</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                </select>

                <button id="add-to-cart">
                    ADD TO BAG
                </button>

            </div>

            <a href="cart.html" class="back-link">
                VIEW BAG
            </a>

        </div>

    </main>

</body>
</html>
